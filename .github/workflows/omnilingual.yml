name: omnilingual

# Builds the Omnilingual ASR sidecar image (omnilingual/) and pushes it to GHCR
# so hosts can `docker compose --profile omnilingual pull`. Only runs when the
# sidecar changes. Model weights are not baked in — they download into the
# omnilingual-cache volume on first start.

on:
  push:
    branches: [main]
    paths:
      - omnilingual/**
      - .github/workflows/omnilingual.yml
  pull_request:
    branches: [main]
    paths:
      - omnilingual/**
      - .github/workflows/omnilingual.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/omnilingual-asr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Only the dependency-free region planner; the server needs a GPU + 7B model.
      - run: uv run --no-project --with pytest pytest -q test_regions.py
        working-directory: omnilingual

  image:
    runs-on: ubuntu-latest
    needs: test
    env:
      CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Free up disk space
        # torch + CUDA wheels are several GB installed; ubuntu-latest has ~14 GB free.
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: omnilingual
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && env.CAN_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
