name: image

# Builds the image once on an x86_64 runner and pushes it to GHCR, so on-prem
# hosts `docker compose pull` instead of compiling whisper.cpp + CUDA from
# source on every deploy. Also keeps nvcc off qemu, which is where local
# builds from an arm64 Mac fall over.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # internal/web/dist is gitignored, so //go:embed has nothing to embed in
      # a fresh checkout and the package fails to compile. The real SPA is
      # built inside the image; a placeholder is enough for vet/test.
      - name: Stage embed placeholder
        run: |
          mkdir -p internal/web/dist
          echo '<!doctype html><title>placeholder</title>' > internal/web/dist/index.html

      - run: go vet ./...
      - run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    needs: test
    env:
      # Same-repo events (push, tag, branch PR) get a write-scoped
      # GITHUB_TOKEN and can authenticate to GHCR. Fork PRs get a read-only
      # token, so they build without touching the registry cache.
      CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Free up disk space
        # ubuntu-latest ships ~14 GB free on /. The CUDA devel image alone is
        # ~8 GB extracted, plus the whisper build tree and the runtime image —
        # it does not fit. Drop preinstalled toolchains this build never uses.
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip on pull_request: forks have no push credentials. The build still
        # runs, so a PR that breaks the Dockerfile fails here rather than on-prem.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha- tags are the ones to pin in .env for a rollback-able deploy.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The whisper.cpp/CUDA stage is ~15 min from cold; cache it in GHA so
          # only Go/frontend changes rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CUDA_VERSION=12.6.3
            CUDA_ARCHS=86
            WHISPER_CPP_REF=v1.8.6
