# Single compose file. Every knob comes from `.env` — copy .env.example to .env
# and edit. See DEPLOY.md.
#
#   docker compose pull && docker compose up -d     # registry image (preferred)
#   docker compose build && docker compose up -d    # build the app image locally
#
# This service REQUIRES an NVIDIA GPU and driver. whisper-cli is dynamically
# linked against libcuda.so.1, which the NVIDIA Container Toolkit injects, so
# without a GPU the binary cannot start at all — there is no CPU fallback in the
# container. For local development on a machine without an NVIDIA GPU, run the
# binary natively instead (`make build`); see README.md.
name: transcriber

services:
  transcriber:
    image: ${IMAGE:-ghcr.io/bcc-code/transcriber:latest}
    build:
      context: .
      args:
        # Prebuilt whisper.cpp/CUDA base. Bump this to change whisper or CUDA
        # versions; it is built separately by .github/workflows/whisper-base.yml.
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/bcc-code/whisper-cuda:v1.8.6-cuda12.6.3}
    restart: unless-stopped

    # BIND_ADDR=0.0.0.0 preserves the previous behaviour: the API has no
    # authentication, so anything that can reach this port can read and write
    # any path visible inside the container. Firewall it, or set BIND_ADDR to
    # an internal interface.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-8888}:${PORT:-8888}"

    command:
      - "-port=${PORT:-8888}"
      - "-workers=${WORKERS:-2}"
      - "-remote-workers=${REMOTE_WORKERS:-10}"
      - "-callback-workers=${CALLBACK_WORKERS:-2}"
      - "-default-model=${DEFAULT_MODEL:-whisper-cpp-large-v3}"
      - "-default-language=${DEFAULT_LANGUAGE:-}"
      - "-job-timeout=${JOB_TIMEOUT:-30m}"
      - "-max-terminal-jobs=${MAX_TERMINAL_JOBS:-200}"
      - "-log-format=${LOG_FORMAT:-json}"

    # Optional ElevenLabs Scribe backend; registered only when the key is set.
    environment:
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_DEFAULT_MODEL: ${ELEVENLABS_DEFAULT_MODEL:-}
      # Optional OpenRouter backends; registered only when the key is set.
      OPENROUTER_KEY: ${OPENROUTER_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-}
      # Forced alignment of the local whisper models' words (aligner service
      # below). Set ALIGNER_URL= (empty) in .env to turn it off. If the
      # aligner is down, jobs still complete with whisper's own timestamps.
      ALIGNER_URL: ${ALIGNER_URL-http://aligner:8000}

    volumes:
      # ggml model cache — first job downloads ~3 GB, this keeps it.
      - models:/var/cache/transcriber
      # Audio in / transcripts out. Job requests carry absolute paths that are
      # resolved *inside* the container, so host and container paths must match.
      # STORAGE_PATH must already exist on the host: Docker otherwise creates
      # it as an empty root-owned directory and every job fails with ENOENT.
      - ${STORAGE_PATH:-/mnt/storage}:${STORAGE_PATH:-/mnt/storage}
      # Read-only source share (audio in). Same-path rule as above. Must exist
      # on the host too, or Docker creates it as an empty directory.
      - ${SOURCE_PATH:-/mnt/isilon}:${SOURCE_PATH:-/mnt/isilon}:ro
      # Default prompts are baked into the image from prompts/. Uncomment to
      # edit them without rebuilding.
      # - ./prompts:/app/prompts:ro

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-8888}/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Forced aligner (aligner/): re-times words from the local whisper models
  # with wav2vec2. Only reachable from the transcriber over the compose
  # network; it has no auth and reads any path it is given, so don't publish
  # its port. It reads the audio itself, so it needs the same mounts.
  aligner:
    image: ${ALIGNER_IMAGE:-ghcr.io/bcc-code/transcriber-aligner:latest}
    build:
      context: ./aligner
    restart: unless-stopped
    environment:
      # Load the Norwegian model at startup instead of on the first job
      # (first start downloads ~4 GB into the aligner-models volume).
      ALIGN_PRELOAD: ${ALIGN_PRELOAD-no}
      # Per-language model overrides, e.g. "no=NbAiLab/nb-wav2vec2-300m-bokmaal".
      ALIGN_MODELS: ${ALIGN_MODELS:-}
    volumes:
      - aligner-models:/models
      - ${STORAGE_PATH:-/mnt/storage}:${STORAGE_PATH:-/mnt/storage}:ro
      - ${SOURCE_PATH:-/mnt/isilon}:${SOURCE_PATH:-/mnt/isilon}:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      # Model download on first start.
      start_period: 600s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
  aligner-models:
