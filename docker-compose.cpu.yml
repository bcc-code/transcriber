# CPU-only overlay for hosts with no NVIDIA GPU (Mac dev, CPU-only Linux).
# Pair with NO_GPU=true in .env so whisper-cli is also told to use its CPU
# backend — without that flag the CUDA backend initializes, finds no device,
# and every job fails.
#
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# `!reset` drops the GPU device reservation inherited from docker-compose.yml.
# An empty list (`devices: []`) does NOT work — Compose treats that as "no
# change" and keeps the nvidia reservation, which then fails to start.
#
# Transcription on CPU is 20-50x slower than on the 3090 — fine for a sanity
# check on a short file, not for production throughput.
services:
  transcriber:
    deploy: !reset null
